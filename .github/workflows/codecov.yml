# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: "Codecov"

run-name: "Codecov • ${{ github.ref_name }} @${{ github.actor }}"

concurrency:
    group: "codecov-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

on:
    workflow_dispatch:

jobs:
    coverage:
        name: "Run Coverage And Upload (${{ matrix.label }})"
        runs-on: "${{ matrix.os }}"
        timeout-minutes: 20
        permissions:
            contents: "read"
        strategy:
            fail-fast: true
            matrix:
                include:
                    - label: "linux"
                      os: "ubuntu-latest"
                      codecov_flag: "os-linux"
                    - label: "windows"
                      os: "windows-latest"
                      codecov_flag: "os-windows"
                    - label: "macos"
                      os: "macos-latest"
                      codecov_flag: "os-macos"
        defaults:
            run:
                shell: "bash"

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              if: "${{ matrix.os == 'ubuntu-latest' }}"
              uses: "step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40" # v2.20.1
              with:
                  egress-policy: "audit"

            - name: "Checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  fetch-depth: 2

            - name: "Setup Node.js"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  cache: "npm"
                  cache-dependency-path: "package-lock.json"

            - name: "Setup npm"
              run: "npm install --global npm@12.0.2"

            - name: "Install dependencies"
              run: "npm ci"

            - name: "Build package"
              run: "npm run build"

            - name: "Run tests with coverage and emit JUnit report"
              run: "npm run test:ci:coverage"
              env:
                  CI: "true"
                  MAX_THREADS: "1"
                  TYPEDOC_VITEST_HANGING_PROCESS_REPORTER: "true"
                  VITEST_HANGING_PROCESS_REPORTER: "true"

            - name: "Verify coverage artifact"
              run: >-
                  python -c "from pathlib import Path; assert Path('coverage/lcov.info').is_file(), 'coverage/lcov.info was not generated'"

            - name: "Verify JUnit artifact"
              run: >-
                  python -c "from pathlib import Path; assert Path('test-report.junit.xml').is_file(), 'test-report.junit.xml was not generated'"

            - name: "Upload test results to Codecov"
              if: "${{ !cancelled() }}"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  slug: "Nick2bad4u/eslint-plugin-typedoc"
                  files: "test-report.junit.xml"
                  flags: "unit,${{ matrix.codecov_flag }}"
                  name: "vitest-junit-${{ matrix.codecov_flag }}"
                  report_type: "test_results"
                  fail_ci_if_error: true
                  disable_search: true
                  verbose: true

            - name: "Upload coverage to Codecov"
              if: "${{ !cancelled() }}"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  slug: "Nick2bad4u/eslint-plugin-typedoc"
                  files: "./coverage/lcov.info"
                  flags: "unit,${{ matrix.codecov_flag }}"
                  name: "vitest-unit-coverage-${{ matrix.codecov_flag }}"
                  report_type: "coverage"
                  fail_ci_if_error: true
                  disable_search: true
                  verbose: true

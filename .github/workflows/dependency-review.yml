# Dependency Review Action
#
# This Action scans dependency manifests changed in pull requests and reports
# known vulnerabilities for updated or introduced packages.

# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: "Dependency Review"

run-name: "Dependency Review • ${{ github.ref_name }} @${{ github.actor }}"

on:
    pull_request:
    merge_group:
        types:
            - "checks_requested"

concurrency:
    group: "dependency-review-${{ github.ref }}"
    cancel-in-progress: true

jobs:
    dependency-review:
        name: "Dependency Review"
        runs-on: "ubuntu-latest"
        timeout-minutes: 20
        permissions:
            contents: "read"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - name: "Checkout Repository"
              uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0

            - name: "Dependency Review"
              uses: "actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294" # v5.0.0
              with:
                  fail-on-severity: "moderate"
